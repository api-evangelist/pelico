name: Pelico
description: >-
  Pelico is a manufacturing orchestration platform that bridges the execution
  gap between planning and real-world production. It unifies data from
  suppliers, production, inventory, quality, maintenance, and customers into a
  single operational view across multi-level BOMs and multi-plant networks.
  Domain-specific AI agents continuously monitor disruptions, determine upstream
  and downstream impact, simulate recovery options (alternates, stock transfers,
  resequencing), and keep cross-functional teams synchronized in real time.
  Pelico integrates with major ERP systems (SAP, Oracle, Infor) and cloud
  providers (AWS, Azure, Google Cloud), exposing APIs to ingest new data sources
  and push actions into existing enterprise systems. The company is SOC 2 Type
  II and ISO 27001:2022 certified and GDPR compliant. This profile is maintained
  in the API Evangelist network; Pelico is a portfolio company of General
  Catalyst and does not publish a public developer API, portal, or OpenAPI at
  this time — its API surface is enterprise integration only.
